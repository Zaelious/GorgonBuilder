name: T0019 staging (manual approval only)

on:
  workflow_dispatch:
    inputs:
      confirm_database:
        description: 'Type gorgonbuilder-staging to authorize this staging run'
        required: true
        type: string
      confirm_backup:
        description: 'I will review the preflight migration list and recovery bookmark before approving deployment'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gorgonbuilder-staging
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'Zaelious/GorgonBuilder' && inputs.confirm_database == 'gorgonbuilder-staging' && inputs.confirm_backup
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Guard the exact staging target (no provisioning)
        run: node scripts/staging-target.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Capture recovery bookmark, then inspect pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 time-travel info DB --env staging --json > recovery-bookmark.json
          # Wrangler list may initialize its empty d1_migrations tracking table. Capture
          # recovery first; the preflight approval explicitly authorizes this metadata write.
          npx wrangler d1 migrations list DB --env staging --remote > pending-migrations.txt
          cat pending-migrations.txt >> "$GITHUB_STEP_SUMMARY"
          cat recovery-bookmark.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the pending migrations and recovery bookmark above. Approve the deploy job only after checking the exact database and recovery plan.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in GitHub before adding secrets.
    # This is a second approval after the preflight job completes.
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node scripts/staging-target.ts
      - run: npm run lint && npm test -- --maxWorkers=2 --testTimeout=15000 && npm run build
      - name: Apply only staging migrations (explicit owner approval above)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy only the staging Worker (no secrets changed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging --name gorgonbuilder-staging
