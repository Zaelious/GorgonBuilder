name: Bootstrap Cloudflare lockfile

on:
  push:
    branches:
      - chore/cloudflare-workers-config

permissions:
  contents: write

jobs:
  update-lockfile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use supported Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate lockfile for pinned Wrangler
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from regenerated lockfile
        run: npm ci --no-audit --no-fund

      - name: Run quality checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(cloudflare): synchronize pinned Wrangler lockfile [skip ci]"
            git push origin HEAD:chore/cloudflare-workers-config
          fi
